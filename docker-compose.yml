version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - GazeFlap_db:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/GazeFlap.db
      - SECRET_KEY=${SECRET_KEY:-default_secret_key_change_me_in_prod}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  GazeFlap_db:
